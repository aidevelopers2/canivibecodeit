name: validate

# Every app entry arrives as a PR, so the schema check runs on the PR itself.
# Schema only — no build — so contributors get an answer in seconds.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
